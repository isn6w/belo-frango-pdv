services:
  - type: web
    name: belo-frango-pdv
    env: node
    plan: starter
    buildCommand: rm -rf node_modules && npm install --build-from-source
    startCommand: npm start
    disk:
      name: belo-frango-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/belo-frango.db
      - key: SESSION_SECRET
        generateValue: true
